<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>石大·智巡 | 3D 校园可视化系统</title>
  <style>
    :root{
      --bg:#07111d;--panel:#0c1928;--panel2:#101f31;--line:#20354a;
      --text:#e9f3ff;--muted:#88a0b9;--cyan:#34d9e9;--blue:#4e83ff;
      --green:#4fe19b;--amber:#ffbd5a;--red:#ff6f7e;--shadow:0 18px 50px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 70% -10%,#18395d 0,#07111d 44%,#050b13 100%);color:var(--text);font:13px/1.4 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
    button{font:inherit;color:inherit;border:0;cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:68px 1fr 30px}
    header{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(6,15,25,.8);backdrop-filter:blur(12px);z-index:5}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#2d73ff);display:grid;place-items:center;box-shadow:0 0 28px #1dd3dc66;font-weight:800;color:#03131e}.brand h1{font-size:16px;margin:0;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px;letter-spacing:1px}
    .header-right{display:flex;gap:18px;align-items:center}.live{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.live i{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green);animation:pulse 1.6s infinite}.date{color:var(--muted);font-variant-numeric:tabular-nums}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    main{min-height:0;display:grid;grid-template-columns:252px 1fr 310px;gap:12px;padding:12px}
    .side,.inspector,.hud-card{background:linear-gradient(180deg,rgba(15,31,49,.96),rgba(7,18,30,.96));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    .side{padding:16px;display:flex;flex-direction:column;min-width:0}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700}.side-title{font-size:20px;margin:5px 0 18px}.side-sub{color:var(--muted);font-size:12px;margin-bottom:18px}
    .nav{display:flex;flex-direction:column;gap:8px}.nav button{background:transparent;text-align:left;padding:12px;border:1px solid transparent;border-radius:10px;display:flex;align-items:center;gap:10px;color:var(--muted);transition:.2s}.nav button:hover{background:#13263a;color:var(--text)}.nav button.active{background:linear-gradient(90deg,#12354d,#12263b);border-color:#235276;color:var(--text);box-shadow:inset 3px 0 var(--cyan)}.nav .ico{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#172d44;color:var(--cyan);font-size:14px}.nav button.active .ico{background:#1d5368}.nav b{font-size:12px}.nav span{display:block;color:inherit;font-size:10px;margin-top:2px;opacity:.7;font-weight:400}
    .side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{padding:10px;background:#0c2134;border-radius:9px;border:1px solid #18334a}.mini strong{font-size:18px;display:block}.mini label{font-size:10px;color:var(--muted)}
    .stage{position:relative;min-width:0;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#071524;box-shadow:var(--shadow)}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,56,85,.25),transparent 44%),radial-gradient(circle at 55% 45%,#16385a33,transparent 60%);pointer-events:none}.stage-top{position:absolute;z-index:2;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.scene-label{display:flex;gap:8px;align-items:center}.scene-label strong{font-size:13px}.scene-label span{color:var(--muted);font-size:11px}.scene-actions{display:flex;gap:7px}.ghost{background:#10273a;border:1px solid #28445d;border-radius:7px;padding:7px 10px;color:#a9c1d6;font-size:11px}.ghost.on{color:var(--cyan);border-color:#29758b;background:#123547}
    #scene{position:absolute;inset:0;width:100%;height:100%}.gridlines{stroke:#1c4860;stroke-width:1;opacity:.34}.water{fill:#103a54;stroke:#2b7691;stroke-width:1}.ground{fill:#0b2930;stroke:#246052;stroke-width:1}.road{fill:none;stroke:#183e4e;stroke-width:18;stroke-linecap:round;opacity:.9}.road2{fill:none;stroke:#28576b;stroke-width:2;stroke-dasharray:5 9;opacity:.8}.building{fill:#183c57;stroke:#4d89a8;stroke-width:1}.roof{fill:#27627a;stroke:#66b1c5;stroke-width:1}.building.warm{fill:#4a3d43;stroke:#b78c75}.roof.warm{fill:#855c56;stroke:#d9aa83}.btext{fill:#bbd8e8;font-size:9px;letter-spacing:.4px}.point{filter:drop-shadow(0 0 5px #42dce8)}
    .legend{position:absolute;left:17px;bottom:16px;display:flex;gap:14px;align-items:center;padding:9px 11px;border:1px solid #214056;background:#071725d9;border-radius:8px;color:#9eb5c9;font-size:10px}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}.legend .l1{background:var(--cyan)}.legend .l2{background:var(--green);border-radius:50%}.legend .l3{background:var(--amber)}
    .inspector{padding:15px;display:flex;flex-direction:column;overflow:auto}.inspect-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:14px}.inspect-head h2{font-size:16px;margin:3px 0}.inspect-head p{font-size:11px;color:var(--muted);margin:0}.status{font-size:10px;border-radius:99px;padding:4px 8px;color:#061720;background:var(--green);font-weight:700}.status.warn{background:var(--amber)}
    .card{border:1px solid #1b354b;background:#0c2032;border-radius:10px;padding:12px;margin-bottom:10px}.card h3{font-size:11px;color:#a5c3d8;margin:0 0 10px;text-transform:uppercase;letter-spacing:1px}.metric-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #183147}.metric-row:last-child{border-bottom:0}.metric-row span{color:var(--muted);font-size:11px}.metric-row strong{font-size:12px}.bar{height:6px;border-radius:9px;background:#163046;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--blue))}.chip-row{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:10px;padding:4px 7px;border-radius:5px;background:#15344a;color:#a8cce0}.button{width:100%;padding:9px;border-radius:8px;background:linear-gradient(90deg,#1b9db4,#3b72f4);font-weight:700;font-size:12px;margin-top:5px}.button.alt{background:#133047;border:1px solid #2b506b;color:#b9d0e4}.robot-list{display:flex;flex-direction:column;gap:7px}.robot{display:flex;align-items:center;gap:8px;padding:8px;background:#10283b;border:1px solid #1d4259;border-radius:8px;cursor:pointer}.robot.sel{border-color:var(--cyan);background:#123c4d}.robot .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.robot .dot.idle{background:var(--amber);box-shadow:0 0 8px var(--amber)}.robot b{font-size:11px;flex:1}.robot em{font-style:normal;color:#87a6bc;font-size:10px}.route-step{display:flex;gap:9px;align-items:flex-start;margin:9px 0}.route-step .num{width:20px;height:20px;border-radius:50%;background:#1c5266;color:var(--cyan);display:grid;place-items:center;font-size:10px;font-weight:700}.route-step strong{font-size:11px;display:block}.route-step small{color:var(--muted);font-size:10px}.progress{height:4px;background:#173047;border-radius:9px;margin:8px 0}.progress i{display:block;background:var(--amber);height:100%;width:54%;border-radius:9px}
    footer{border-top:1px solid var(--line);background:#06111d;padding:0 18px;display:flex;align-items:center;justify-content:space-between;color:#6f899e;font-size:10px}.footer-right{display:flex;gap:15px}.kbd{padding:2px 5px;border:1px solid #254158;border-radius:4px;color:#95afc2}
    .toast{position:absolute;right:18px;bottom:16px;transform:translateY(12px);opacity:0;background:#15354a;border:1px solid #2d7083;border-radius:8px;padding:9px 12px;color:#c9edf2;font-size:11px;transition:.3s;pointer-events:none;z-index:4}.toast.show{opacity:1;transform:none}
    @media(max-width:1100px){main{grid-template-columns:210px 1fr 260px}.side{padding:12px}.side-title{font-size:17px}}@media(max-width:850px){body{overflow:auto}.app{height:auto;min-height:100vh}main{grid-template-columns:1fr;min-height:calc(100vh - 98px)}.side{min-height:210px}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.side-bottom{display:none}.stage{height:62vh;min-height:460px}.inspector{min-height:420px}header{padding:0 12px}.date{display:none}}
  </style>
</head>
<body>

<script>
  const state={module:'campus',labels:true,night:false,robot:'SPOT-01',running:false};
  const inspector=document.getElementById('inspector'), sceneTitle=document.getElementById('sceneTitle'), sceneSub=document.getElementById('sceneSub');
  const views={
    campus:{title:'校园总览 · 俯瞰模式',sub:'一键切换建筑、道路与设备图层',html:`<div class="inspect-head"><div><div class="eyebrow">Module 01 / Spatial Twin</div><h2>校园 3D 浏览</h2><p>空间底座与沉浸式漫游</p></div><span class="status">READY</span></div><div class="card"><h3>场景状态</h3><div class="metric-row"><span>当前视角</span><strong>西区 · 俯瞰 62°</strong></div><div class="metric-row"><span>可见建筑</span><strong>18 / 18</strong></div><div class="metric-row"><span>实时数据</span><strong style="color:var(--green)">已同步</strong></div></div><div class="card"><h3>图层控制</h3><div class="chip-row"><span class="chip">建筑模型</span><span class="chip">道路网络</span><span class="chip">绿化水体</span><span class="chip">设备点位</span></div><button class="button alt" onclick="notify('已开启沉浸漫游：拖拽旋转 · 滚轮缩放')">进入沉浸漫游</button></div><div class="card"><h3>展示目标</h3><p style="color:var(--muted);font-size:11px;margin:0">让校园空间成为统一入口：先看全局，再下钻到建筑、道路与设备，支撑巡检和调度模块共享同一坐标系。</p></div>`},
    robot:{title:'四足机器人 · 多机巡检',sub:'任务、轨迹与设备状态实时联动',html:`<div class="inspect-head"><div><div class="eyebrow">Module 02 / Robot Ops</div><h2>四足机器人巡检</h2><p>多机协同 · 路径可视化</p></div><span class="status">3 ONLINE</span></div><div class="card"><h3>巡检编队</h3><div class="robot-list"><div class="robot sel" data-r="SPOT-01"><i class="dot"></i><b>SPOT-01</b><em>执行中 · 72%</em></div><div class="robot" data-r="SPOT-02"><i class="dot"></i><b>SPOT-02</b><em>执行中 · 48%</em></div><div class="robot" data-r="ANYmal"><i class="dot idle"></i><b>ANYmal</b><em>待命</em></div></div><button class="button" id="missionBtn">${state.running?'暂停巡检':'开始巡检任务'}</button></div><div class="card"><h3>当前任务 · ${state.robot}</h3><div class="metric-row"><span>巡检区域</span><strong>主教学楼 — 东门</strong></div><div class="metric-row"><span>电量 / 信号</span><strong>82% / -58 dBm</strong></div><div class="progress"><i style="width:${state.robot==='SPOT-01'?72:48}%"></i></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:10px"><span>任务进度</span><span>${state.robot==='SPOT-01'?72:48}%</span></div></div><div class="card"><h3>功能边界</h3><p style="color:var(--muted);font-size:11px;margin:0">本模块负责机器人编队、任务下发、状态监测与轨迹回放；不承担车辆配送路径的求解，车辆调度请切换至 VRPTW 模块。</p></div>`},
    route:{title:'VRPTW · 车辆路径规划',sub:'带时间窗约束的车辆调度与优化',html:`<div class="inspect-head"><div><div class="eyebrow">Module 03 / Optimization</div><h2>VRPTW 路径规划</h2><p>时间窗约束 · 多车协同</p></div><span class="status warn">SOLVED</span></div><div class="card"><h3>优化摘要</h3><div class="metric-row"><span>车辆 / 任务点</span><strong>3 / 12</strong></div><div class="metric-row"><span>总里程</span><strong style="color:var(--amber)">4.2 km</strong></div><div class="metric-row"><span>准时率</span><strong style="color:var(--green)">100%</strong></div><div class="metric-row"><span>求解耗时</span><strong>0.38 s</strong></div><button class="button" id="solveBtn">重新求解最优路径</button></div><div class="card"><h3>车辆 01 · 配送路线</h3><div class="route-step"><div class="num">1</div><div><strong>能源中心</strong><small>08:30–08:45 · 装载</small></div></div><div class="route-step"><div class="num">2</div><div><strong>学生公寓</strong><small>08:55–09:10 · 物资配送</small></div></div><div class="route-step"><div class="num">3</div><div><strong>体育馆</strong><small>09:18–09:30 · 签收</small></div></div></div><div class="card"><h3>功能边界</h3><p style="color:var(--muted);font-size:11px;margin:0">本模块负责订单、车辆、时间窗与求解结果可视化；求解结果以路线图层回写 3D 场景，但不控制四足机器人。</p></div>`}
  };
  function render(){const v=views[state.module];inspector.innerHTML=v.html;sceneTitle.textContent=v.title;sceneSub.textContent=v.sub;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.module===state.module));document.getElementById('robots').style.opacity=state.module==='robot'?'1':'0';document.getElementById('routeLines').style.opacity=state.module==='route'?'1':'0';document.getElementById('buildings').style.opacity=state.module==='campus'||state.module==='route'?'1':'.8';document.querySelectorAll('.robot').forEach(r=>{r.classList.toggle('sel',r.dataset.r===state.robot);r.onclick=()=>{state.robot=r.dataset.r;render()}});const mb=document.getElementById('missionBtn');if(mb)mb.onclick=()=>{state.running=!state.running;notify(state.running?'已下发巡检任务，机器人开始移动':'巡检任务已暂停');render()};const sb=document.getElementById('solveBtn');if(sb)sb.onclick=()=>{notify('VRPTW 求解完成：总里程优化至 4.2 km');document.getElementById('routeLines').style.opacity='1'};document.getElementById('labelsBtn').classList.toggle('on',state.labels);document.getElementById('nightBtn').classList.toggle('on',state.night)}
  function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.module=b.dataset.module;render()});
  document.getElementById('labelsBtn').onclick=()=>{state.labels=!state.labels;document.querySelectorAll('.btext').forEach(e=>e.style.opacity=state.labels?'1':'0');render()};
  document.getElementById('nightBtn').onclick=()=>{state.night=!state.night;document.getElementById('scene').style.filter=state.night?'brightness(.68) saturate(1.25) hue-rotate(8deg)':'none';render();notify(state.night?'已切换夜景模式':'已切换日景模式')};
  document.getElementById('resetBtn').onclick=()=>notify('视角已重置为校园总览');
  document.addEventListener('keydown',e=>{if(e.key==='1'){state.module='campus';render()}if(e.key==='2'){state.module='robot';render()}if(e.key==='3'){state.module='route';render()}});
  render();
